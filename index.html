<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebApkMerge - APK File Processor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            background-color: #f8f9ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background-color: #f0f3ff;
            border-color: #764ba2;
        }

        .upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #333;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .upload-hint {
            color: #999;
            font-size: 12px;
        }

        input[type="file"] {
            display: none;
        }

        .file-info {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .file-size {
            color: #666;
            font-size: 14px;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s ease;
            margin-bottom: 10px;
        }

        .button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.info {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status.error {
            background: #ffebee;
            color: #d32f2f;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }

        .progress-bar.show {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .console-container {
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }

        .console-container.show {
            display: block;
        }

        .console-header {
            background: #2d2d2d;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .console-header:hover {
            background: #3d3d3d;
        }

        .console-title {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .console-toggle {
            color: #aaa;
            font-size: 12px;
            transition: transform 0.3s ease;
        }

        .console-toggle.expanded {
            transform: rotate(180deg);
        }

        .console-body {
            background: #1e1e1e;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            line-height: 1.5;
            display: none;
        }

        .console-body.show {
            display: block;
        }

        .console-line {
            color: #d4d4d4;
            margin: 2px 0;
            word-wrap: break-word;
        }

        .console-line.stdout {
            color: #9cdcfe;
        }

        .console-line.stderr {
            color: #f48771;
        }

        .console-line.info {
            color: #4ec9b0;
        }

        .console-body::-webkit-scrollbar {
            width: 8px;
        }

        .console-body::-webkit-scrollbar-track {
            background: #2d2d2d;
        }

        .console-body::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        .console-body::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        .console-clear-btn {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .console-clear-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .console-copy-btn {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .console-copy-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .console-copy-btn.copied {
            color: #4ec9b0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 WebApkMerge</h1>
        <p class="subtitle">Process APK files directly in your browser</p>

        <div class="upload-area" id="uploadArea" role="button" aria-label="Click to select a file or drag and drop a file here" tabindex="0">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Click to select a file or drag it here</div>
            <div class="upload-hint">Supported: APK, XAPK, APKS files</div>
        </div>

        <input type="file" id="fileInput" accept=".apk,.xapk,.apks" aria-label="File input for APK files">

        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
        </div>

        <button class="button" id="processBtn" disabled>Process File</button>

        <div class="progress-bar" id="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="status" id="status" role="status" aria-live="polite"></div>

        <div class="console-container" id="consoleContainer">
            <div class="console-header" id="consoleHeader" role="button" tabindex="0" aria-expanded="false" aria-controls="consoleBody">
                <div class="console-title">
                    <span>🖥️</span>
                    <span>Console Output</span>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button class="console-copy-btn" id="consoleCopyBtn" title="Copy console output to clipboard">Copy</button>
                    <button class="console-clear-btn" id="consoleClearBtn" title="Clear console">Clear</button>
                    <span class="console-toggle" id="consoleToggle">▼</span>
                </div>
            </div>
            <div class="console-body" id="consoleBody" role="region" aria-label="Console output"></div>
        </div>
    </div>

    <script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
    <script src="app.js"></script>
</body>
</html>
